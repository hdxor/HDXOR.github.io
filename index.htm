  <!-- JavaScript 腳本：使用 Plotly 繪製柱狀圖 (Bar Chart) -->
  <script>
    // 1. 定義 X 軸選項與 Y 軸對應數據
    const xArray = ["Very agree", "Agree", "Maybe", "Disagree", "Very disagree"];
    const yArray = [50, 25, 13, 7, 5];

    // 2. 設定圖表資料物件與長條顏色
    const data = [{
      x: xArray,
      y: yArray,
      type: "bar",
      orientation: "v", // 垂直柱狀圖
      marker: {
        color: [
          "rgb(239, 68, 68)",  // 紅
          "rgb(245, 158, 11)", // 橘
          "rgb(34, 197, 94)",  // 綠
          "rgb(20, 184, 166)", // 藍綠
          "rgb(59, 130, 246)"  // 藍
        ]
      }
    }];

    // 3. 設定圖表外觀佈局與背景透明
    const layout = {
      title: {
        text: "Are you donkey?",
        font: { size: 20, color: '#a5f3fc' }
      },
      paper_bgcolor: 'rgba(0,0,0,0)', // 背景透明
      plot_bgcolor: 'rgba(0,0,0,0)',  // 繪圖區透明
      font: { color: '#cbd5e1' },
      xaxis: { gridcolor: '#1c4259', zerolinecolor: '#1c4259' },
      yaxis: { gridcolor: '#1c4259', zerolinecolor: '#1c4259' },
      margin: { t: 50, l: 50, r: 30, b: 50 }
    };

    // 4. 初始化繪製 Plotly 圖表並填入 id="myPlot" 的容器中
    Plotly.newPlot("myPlot", data, layout, { responsive: true, displayModeBar: false });

    // 5. 監聽視窗大小改變事件，實現 RWD 自動重繪圖表
    window.addEventListener('resize', () => {
      Plotly.Plots.resize('myPlot');
    });
  </script>
