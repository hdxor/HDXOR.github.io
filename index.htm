  <script>
    const xArray = ["Very agree", "Agree", "Maybe", "Unagree", "Very unagree"];
    const yArray = [50, 25, 13, 7, 5];

    const data = [{
      x: xArray,
      y: yArray,
      type: "bar",
      orientation: "v",
      marker: {
        color: [
          "rgb(239, 68, 68)",
          "rgb(245, 158, 11)",
          "rgb(34, 197, 94)",
          "rgb(20, 184, 166)",

      },
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      font: { color: '#cbd5e1' },
      xaxis: { gridcolor: '#1c4259', zerolinecolor: '#1c4259' },
      yaxis: { gridcolor: '#1c4259', zerolinecolor: '#1c4259' },
      margin: { t: 50, l: 50, r: 30, b: 50 }
    };

    Plotly.newPlot("myPlot", data, layout, { responsive: true, displayModeBar: false });
